name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  xyz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Run synthetic XYZ checks
        run: python3 -m unittest discover -s tests -v
